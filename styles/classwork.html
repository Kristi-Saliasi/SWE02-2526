<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>Weather App</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:wght@300;400;600&family=DM+Sans:wght@300;400;500&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="classwork.css">
</head>
<body>

  <div class="bg-orb orb1"></div>
  <div class="bg-orb orb2"></div>

  <main class="container">
    <header>
      <p class="label">Live Weather</p>
      <h1>What's the sky doing?</h1>
    </header>

    <div class="search-bar">
      <input type="text" id="cityInput" placeholder="Enter a city..." />
      <button id="searchBtn">Search</button>
    </div>

    <div id="error" class="error hidden">City not found. Try again.</div>

    <div id="weatherCard" class="weather-card hidden">
      <div class="city-name" id="cityName"></div>
      <div class="weather-icon" id="weatherIcon" style="font-size:4rem;"></div>
      <div class="temp" id="temp"></div>
      <div class="description" id="description"></div>
      <div class="details">
        <div class="detail">
          <span class="detail-label">Feels Like</span>
          <span class="detail-value" id="feelsLike"></span>
        </div>
        <div class="detail">
          <span class="detail-label">Humidity</span>
          <span class="detail-value" id="humidity"></span>
        </div>
        <div class="detail">
          <span class="detail-label">Wind</span>
          <span class="detail-value" id="wind"></span>
        </div>
      </div>
    </div>

    <div id="loading" class="loading hidden">Fetching weather...</div>
  </main>

  <script src="classwork.js"></script>
</body>
</html>
